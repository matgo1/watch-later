[project]
name = "tg-bot"
version = "1.0.0"
requires-python = ">=3.14"
dependencies = [
  "aiogram>=3.29.1",
  "httpx>=0.28.1",
  "pydantic-settings>=2.14.2",
  "python-dotenv>=1.2.2",
]

[project.scripts]
bot = "tg_bot.main:main"

[tool.uv]
package = true

[tool.pyright]
venvPath = "."
venv = ".venv"
